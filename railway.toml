# Railway deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
  # Use the combined Python + Node production Dockerfile
  dockerfilePath = "Dockerfile.prod"

[deploy]
  startCommand = "./start.sh"
  # Health-check the Next.js homepage
  healthcheckPath = "/"
  healthcheckTimeout = 60
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

[[volumes]]
  # Persist pipeline/data/ceos.db across deploys and restarts
  mountPath = "/app/pipeline/data"
